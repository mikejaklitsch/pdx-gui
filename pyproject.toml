[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pdx-gui"
version = "1.0.0"
description = "Bidirectional converter between PDX .gui files and a tagged block format"
requires-python = ">=3.10"

[project.scripts]
pdx-gui = "pdx_gui.cli:main"

[tool.setuptools.packages.find]
include = ["pdx_gui*", "pdx_utilities*"]
